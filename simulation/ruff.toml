# Shared lint configuration for every simulation branch.
#
# The selected rules are the ones that catch real defects in scientific code:
# unused imports and variables (usually the residue of a refactor that left a
# half-finished idea behind), ambiguous single-letter names, zip without an
# explicit length policy, and exception handling that discards the cause.

target-version = "py310"
line-length = 100
extend-exclude = ["build", "results", "data"]

[lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",     # line length is handled by the formatter, not by failing a build
    "RUF001",   # French text in comments and docstrings uses characters this rule flags
    "RUF002",
    "RUF003",
]

[lint.per-file-ignores]
# The scripts under mali_powerfactory/scripts run inside PowerFactory's own
# Python engine, where the powerfactory module is injected by the application.
"**/mali_powerfactory/scripts/*.py" = ["F401"]
"**/tests/*.py" = ["B011"]

[lint.isort]
known-first-party = [
    "mali_energy", "mali_pandapower", "mali_pandapipes",
    "mali_openmodelica", "mali_simscape", "mali_powerfactory", "mali_benchmark",
]
