[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malinergy"
version = "0.1.0"
description = "Plateforme de connaissances ouverte sur le secteur energetique malien: donnees sourcees et analyse d'aide a la decision."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-4.0"}
keywords = ["mali", "energie", "electricite", "edm-sa", "solaire", "politique publique"]
dependencies = []

[project.scripts]
malinergy = "malinergy.cli:main"

[project.urls]
Source = "https://github.com/djonfaga/malinergy"

[tool.setuptools]
packages = ["malinergy", "malinergy.analysis"]

[tool.setuptools.package-data]
malinergy = ["data/*.json"]
